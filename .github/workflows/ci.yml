name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      API_KEY: ""
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest tests -q

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: story_ai
          MYSQL_USER: story_dev
          MYSQL_PASSWORD: storypass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/story_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
      DB_USERNAME: story_dev
      DB_PASSWORD: storypass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Apply migrations V1 through V15
        shell: bash
        run: |
          for version in $(seq 1 15); do
            migration=$(find backend/src/main/resources/db -name "V${version}__*.sql" -print -quit)
            test -n "$migration"
            mysql --protocol=tcp -h 127.0.0.1 -u story_dev -pstorypass story_ai < "$migration"
          done
      - run: mvn -f backend/pom.xml test

# Real-LLM acceptance is intentionally excluded from CI. RH-10 runs it
# explicitly with qwen3.7-plus after the deterministic engineering gate passes.
