server:
  port: 8080

spring:
  application:
    name: story-ai-backend
  # All secrets come from environment variables; the defaults below are dev-only
  # placeholders (no real password is ever committed). See application-local.yml.example.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/story_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Python AI Service location (used by AiServiceClient, TASK-006)
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.example.storyai: INFO
